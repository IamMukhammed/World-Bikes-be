version: '3.3'

services:
  bikes-api:
    container_name: bikes-api
    restart: always
    image: node:20.10.0
    ports:
      - 4001:3007
    volumes:
      - ./:/usr/src/bikes
    working_dir: /usr/src/bikes

    networks:
      - monorepo-network

    # FOR PRODUCTION
    command: bash -c "npm install && npm run build && npm run start:prod"

  bikes-batch:
    container_name: bikes-batch
    restart: unless-stopped
    image: node:20.10.0
    ports:
      - 4002:3008
    volumes:
      - ./:/usr/src/bikes
    working_dir: /usr/src/bikes

    networks:
      - monorepo-network

    # FOR PRODUCTION
    command: bash -c "npm install && npm run build && npm run start:prod:batch"

networks:
  monorepo-network:
    driver: bridge
# bikes-next:   localhost:4000 <=> container:3000
# bikes-api:    localhost:4001 <=> container:3007
# bikes-batch:  localhost:4002 <=> container:3008
